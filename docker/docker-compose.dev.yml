# docker/docker-compose.dev.yml

services:
  redis:
    image: redis:8.10                         # 2026-10-29: redis:8.10.3 is the latest stable patch listed on Docker Hub
    container_name: estimator-redis
    restart: unless-stopped
    env_file:
      - ../src/aie_estimator/.env.dev         # Unversioned file .env.* with secure credentials, its path is relative to this docker-compose.yml
    ports:
      - "${REDIS_PORT:-6379}:6379"            # Syntax: ${ENV_VAR_FOR_HOST_PORT:-DEFAULT_VALUE} : CONTAINER_PORT
    volumes:
      # Bind mounts (https://docs.docker.com/engine/storage/bind-mounts/) a file or dir on the host machine
      # 1. When you use a "Bind Mount", a file or dir on the host machine is mounted directly from the host into a container.
      #    In general, this is preferred to Named Volumes if you need to access the data from outside the container.
      - ./volumes/redis_data:/data
      # 2. By contrast, when you use "Named Volumes", they are persistent data stores created and managed by Docker.
      # - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s                           # Time between health checks
      timeout: 5s                             # Timeout for each health check
      retries: 6                              # Nº of retries before considering the container unhealthy
      start_period: 60s                       # Initial delay before starting health checks
    # Required to be connected from the aie-estimator project running on IDE or Windows
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Maps host.docker.internal to the host IP

  redisinsight:
    image: redis/redisinsight:latest
    container_name: estimator-redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"                           # Redis Insight UI: http://localhost:5540
    environment:
      - RI_REDIS_HOST=redis                   # Preconfigured connection to the redis service on estimator-network
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=estimator-redis
    volumes:
      - ./volumes/redisinsight_data:/data     # Persist Redis Insight settings
    depends_on:
      redis:
        condition: service_healthy

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: estimator-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"                           # Phoenix UI dashboard: http://localhost:6006
      - "4317:4317"                           # OTLP gRPC collector port
      - "4318:4318"                           # OTLP HTTP collector port
    environment:
      - PHOENIX_ENABLE_AUTH=false             # Disable authentication for local development
    volumes:
      - ./volumes/phoenix_data:/root/.phoenix # Embedded DuckDB persistence
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: pgvector/pgvector:pg17             # Precompiled pgvector extension (activated in Session 7 via migration)
    container_name: estimator-postgres        # Fixed container name for the PostgreSQL persistence service
    restart: unless-stopped                   # Restart automatically unless explicitly stopped
    env_file:
      - ../src/aie_estimator/.env.dev         # Unversioned file .env.* with secure credentials, its path is relative to this docker-compose.yml
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-estimator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estimator}
      POSTGRES_DB: ${POSTGRES_DB:-estimator}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"         # Syntax: ${ENV_VAR_FOR_HOST_PORT:-DEFAULT_VALUE} : CONTAINER_PORT
    volumes:
      # Bind Mount (https://docs.docker.com/engine/storage/bind-mounts/), a file or dir on the host machine is mounted
      # directly from the host into a container. Preferred over Named Volumes when accessing data from the host.
      - ./volumes/postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Wait until the database is ready to accept TCP commands before declaring it healthy.
      # $$ Prevents Docker from expanding the variable before sending it to the container.
      # -h 127.0.0.1 forces TCP connection to bypass the temporary init server (which uses Unix sockets).
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER:-estimator} -d $${POSTGRES_DB:-estimator}" ]
      interval: 10s                           # Time between health checks
      timeout: 5s                             # Timeout for each health check
      retries: 5                              # Nº of retries before considering the container unhealthy
      start_period: 20s                       # Initial delay before starting health checks
    # Required to be connected from the aie-estimator project running on IDE or Windows
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Maps host.docker.internal to the host IP

# Network configuration for service communication
networks:
  # Define the shared bridge network for inter-service communication.
  default:
    name: estimator-network                   # Network name
    driver: bridge                            # Standard bridge network for local deployment