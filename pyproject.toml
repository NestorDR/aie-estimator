[project]
name = "aie-estimator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NestorDR", email = "ndr1970@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.146.0",
    "openai>=3.35.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
aie-estimator = "aie_estimator:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "aie_estimator.main:app"
reload = true

[dependency-groups]
dev = []
