[project]
name = "aie-estimator"
version = "0.1.0"
description = "Estimator"
readme = "README.md"
authors = [{ name = "NestorDR", email = "ndr1970@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "litellm>=1.83.0",
    "openai>=3.35.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "streamlit>=1.66.1",
    "structlog>=26.1.0",
    # extra [standard] (uvloop & httptools) to improve overall API performance
    "uvicorn[standard]>=0.54.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.8.4",
    "ruff>=0.17.3",
]

[project.scripts]
aie-estimator = "aie_estimator.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "aie_estimator.server:server.app"
reload = true

[tool.ruff]
line-length = 140
target-version = "py314"

[tool.ruff.lint]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".pytest_cache",
    "build",
    "dist",
    "*.egg-info",
    "docs",
    "zero",
]
# Linting rules.
# E (pycodestyle) and F (pyflakes) are roughly equivalent to flake8's default rules.
# I (isort) for import sorting.
# B (bugbear) for detecting potential bugs.
# N (naming) for naming conventions.
# R (refactoring) for refactoring suggestions.
# S (security) for security-related issues.
select = ["E", "F", "B", "R", "S", "N"]
ignore = [ # Ignored rules
    "E501", # Ignored because line-length is handled by the 'line-length' setting.
    "E203", # Whitespace before ':' (common conflict with Black).
    "B008", # Ignore the use of functions as the default argument in function signatures (common in FastAPI).
    "B017", # Ignore assert blind exception: `Exception`
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # Ignore the use of asserting in test files
    "S311", # Ignore the use of pseudo-random generators in test files
]

[tool.pytest.ini_options]
# --cov=aie_estimator: Measure line and branch coverage across the core backend package.
# --cov=streamlit_app: Measure line and branch coverage across the Streamlit UI module.
# --cov-branch: Measure branch coverage evaluating both True and False conditional branches.
# --cov-report=term-missing: Print terminal summary table showing line numbers of unexecuted code.
# --cov-fail-under=85: Fail the test run if coverage is less than 85%.
addopts = "--cov=aie_estimator --cov-branch --cov-report=term-missing --cov-fail-under=85"
pythonpath = [".", "src"]      # Add root and src to pythonpath for imports
testpaths = ["tests"]          # Specify test directory
python_files = ["test_*.py"]

[tool.pytest_env]
APP_ENV = "test"
