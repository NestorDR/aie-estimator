[project]
name = "aie-estimator"
version = "0.1.0"
description = "Estimator"
readme = "README.md"
authors = [{ name = "NestorDR", email = "ndr1970@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.3.0",
    "en-core-web-sm",
    # faker: Generates realistic fake values (names, emails, etc.) used as deterministic pseudonyms
    # by the PII ConsistentPseudonymizer.
    "faker>=40.63.0",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    # instructor: Wraps LiteLLM/OpenAI/Anthropic clients to return Pydantic-validated structured outputs, 
    # with automatic validation retries.
    "instructor>=1.17.0",
    "jinja2>=3.1.6",
    "litellm>=1.83.0",
    # OpenAI>=3.35.0 conflicts with instructor>=1.17.0 regarding `jitter` library versions
    "openai>=3.0.0,<3.35.0",
    # OpenInference (Arize) instrumentor: turns LiteLLM calls into OpenTelemetry spans with LLM attributes
    # (prompt, model, tokens) that Phoenix displays.
    "openinference-instrumentation-litellm>=0.1.20",
    # OpenTelemetry: Distributed tracing API/SDK with OTLP (OpenTelemetry Protocol) export (gRPC :4317) to Arize Phoenix,
    # FastAPI auto-instrumentation, and OpenInference spans for LiteLLM calls.
    "opentelemetry-api>=1.30.0",
    "opentelemetry-exporter-otlp>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-sdk>=1.30.0",
    "pandas>=3.1.1",
    # pandera: DataFrame schema validation for the budget cleaning pipeline (Session 6);
    # lazy mode collects every row failure so invalid records can be quarantined.
    "pandera>=0.36.0",
    "presidio-analyzer>=2.2.366",
    "psycopg[binary,pool]>=3.3.0",
    "pydantic-settings>=2.16.0",
    "pypdf>=7.0.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "streamlit>=1.66.1",
    "structlog>=26.1.0",
    # tiktoken: OpenAI BPE tokenizer, it counts tokens locally (no API call) for Chunk.token_count and embedding cost estimates.
    "tiktoken>=0.14.0",
    # extra [standard] (uvloop & httptools) to improve overall API performance
    "uvicorn[standard]>=0.54.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.8.4",
    "ruff>=0.17.3",
]

[project.scripts]
aie-estimator = "aie_estimator.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "aie_estimator.server:create_app"
reload = true

[tool.ruff]
line-length = 140
target-version = "py314"
extend-exclude = ["samples", "zero"]

[tool.ruff.lint]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".pytest_cache",
    "build",
    "dist",
    "*.egg-info",
    "docs",
    "samples",
    "zero",
]

# Linting rules:
# - B (flake8-bugbear): common Python bug patterns and design pitfalls.
# - E (pycodestyle) & F (pyflakes): core syntax, style, and undefined-name checks (flake8 baseline).
# - I (isort): for import sorting, but it is omitted because AGENTS.md enforces a custom 3-group commented import layout.
# - N (pep8-naming): PEP 8 naming conventions.
# - S (flake8-bandit): security checks.
# - ASYNC (flake8-async): detects blocking I/O, sleep, or subprocess calls inside `async def`.
# - PLR (Pylint Refactor): structural complexity and conditional-flow simplifications.
# - RUF (Ruff-specific): modern Python hygiene (unused `# noqa`, unreferenced `create_task`, etc.).
select = ["B", "E", "F", "N", "S", "ASYNC", "PLR", "RUF"]
ignore = [
    "E501",    # Line length is enforced by `[tool.ruff].line-length`.
    "E203",    # Whitespace before ':' (Black/Ruff formatter compatibility).
    "B008",    # Function calls in default arguments (standard FastAPI `Depends(...)` / `Form(...)`).
    "B017",    # Blind `pytest.raises(Exception)` assertions.
    "PLR0913", # Too many arguments (common in FastAPI route handlers with DI and typed constructors).
    "PLR0917", # Too many positional arguments (redundant with FastAPI/service signatures).
    "PLR2004", # Magic value comparisons (noisy on HTTP status codes, thresholds, and test assertions).
    "RUF001",  # Ambiguous Unicode in strings (legitimate em-dashes `—` and math symbols `×`).
    "RUF002",  # Ambiguous Unicode in docstrings (same as RUF001).
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # Allow `assert` statements in tests.
    "S311", # Allow non-cryptographic `random` in test fixtures.
]

[tool.pytest.ini_options]
# DO NOT add --cov-fail-under here: enforcing threshold in addopts breaks single test file execution.
# The 85% gate is enforced via CLI (--cov-fail-under=85) or auto/test.cmd during full regression runs.
# --cov=aie_estimator: Measure line and branch coverage across the core backend package.
# --cov=streamlit_app: Measure line and branch coverage across the Streamlit UI module.
# --cov-branch: Measure branch coverage evaluating both True and False conditional branches.
# --cov-report=term-missing: Print terminal summary table showing line numbers of unexecuted code.
addopts = "--cov=aie_estimator --cov=streamlit_app --cov-branch --cov-report=term-missing --basetemp=.pytest_tmp"
# Add root and src to pythonpath for imports
pythonpath = [".", "src"]
# Specify test directory and files
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "live_db: opt-in integration tests requiring a live PostgreSQL instance (--live-db)",
]

[tool.pytest_env]
APP_ENV = "test"
LLM_MODEL = "reasoner-fast"
OPENAI_API_KEY = ""
# When litellm is invoked, its internal pricing module (litellm.litellm_core_utils.get_model_cost_map) defaults to downloading the latest pricing dictionary over HTTP from:
# https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json
# In sandboxed test runners, offline CI/CD, or restricted networks:
# - The network connection fails ([Errno 11001] getaddrinfo failed).
# - LiteLLM initiates three retries with exponential backoff, causing a blocking ~15-second hang on test startup and emitting warning logs before falling back to its packaged copy.
# - Setting LITELLM_LOCAL_MODEL_COST_MAP="True" instructs LiteLLM to bypass remote network requests and read its bundled model_prices_and_context_window_backup.json immediately.
LITELLM_LOCAL_MODEL_COST_MAP = "True"

[tool.uv.sources]
# The `en-core-web-sm` model is a small English language model for spaCy, which is used for natural language processing tasks
# such as tokenization, part-of-speech tagging, and named entity recognition.
# The URL provided points to the specific version of the model that can be downloaded and installed as a Python wheel package.
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
